name: Build Site
on: {push: {branches: [main]}, workflow_dispatch: null}
permissions: {contents: write}
jobs: {build: {runs-on: ubuntu-latest, steps: [{name: Checkout, uses: 'actions/checkout@v4'}, {name: Setup Node, uses: 'actions/setup-node@v4', with: {node-version: '20'}}, {name: Install dependencies, run: 'npm install'}, {name: Build, run: 'npm run build'}, {name: Commit build output, run: 'git config user.name "github-actions[bot]" && git config user.email "actions@github.com" && git add -f dist && git commit -m "Add build output [skip ci]" || echo nochanges && git push'}]}}
