name: Build & Deploy to GoDaddy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # يرفع محتويات dist إلى public_html على GoDaddy عبر FTP
      # الأسرار المطلوبة في GitHub → Settings → Secrets and variables → Actions:
      #   GODADDY_FTP_SERVER   مثال: ftp.fzaeen.com
      #   GODADDY_FTP_USERNAME
      #   GODADDY_FTP_PASSWORD
      #   GODADDY_FTP_SERVER_DIR  مثال: /public_html/  أو /home/USER/public_html/
      - name: Deploy to GoDaddy (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.GODADDY_FTP_SERVER }}
          username: ${{ secrets.GODADDY_FTP_USERNAME }}
          password: ${{ secrets.GODADDY_FTP_PASSWORD }}
          server-dir: ${{ secrets.GODADDY_FTP_SERVER_DIR }}
          local-dir: ./dist/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
