name: Build & Deploy to GoDaddy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.GODADDY_FTP_SERVER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Upload the build output so it can be downloaded and uploaded manually to cPanel if needed
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

      # Uploads dist contents to public_html on GoDaddy over FTP.
      # Required secrets (Settings > Secrets and variables > Actions):
      #   GODADDY_FTP_SERVER      e.g. ftp.fzaeen.com
      #   GODADDY_FTP_USERNAME
      #   GODADDY_FTP_PASSWORD
      #   GODADDY_FTP_SERVER_DIR  e.g. /public_html/
      # This step is skipped automatically when the secrets are missing, instead of failing the run.
      - name: Deploy to GoDaddy (FTP)
        if: ${{ env.FTP_SERVER != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.GODADDY_FTP_SERVER }}
          username: ${{ secrets.GODADDY_FTP_USERNAME }}
          password: ${{ secrets.GODADDY_FTP_PASSWORD }}
          server-dir: ${{ secrets.GODADDY_FTP_SERVER_DIR }}
          local-dir: ./dist/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store

      - name: FTP deploy skipped
        if: ${{ env.FTP_SERVER == '' }}
        run: |
          echo "::warning::FTP deploy skipped because GODADDY_FTP secrets are not configured. Download the dist artifact from this run and upload it manually to public_html, or add the four secrets to enable automatic deployment."
